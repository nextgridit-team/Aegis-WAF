name: Security regression and fuzz checks
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  attack-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Attack, false-positive, body-bound and telemetry regressions
        run: go test -race -count=1 ./internal/app -run 'TestAttackRegressionMatrix|TestScopedSignatureExceptions|TestBodyInspectionBoundsAndReplay|TestSecurityTelemetryPrivacy|FuzzRequestBodyReplay'
      - name: Bounded request-body fuzzing
        run: go test ./internal/app -run '^$' -fuzz '^FuzzRequestBodyReplay$' -fuzztime=20s -parallel=2
