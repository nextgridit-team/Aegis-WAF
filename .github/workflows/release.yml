name: Tagged release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release (for example v0.1.0). Signatures from dispatch runs identify the branch, not the tag, so prefer a tag push.'
        required: false
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a version tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*)
              echo "Releasing $TAG"
              ;;
            *)
              echo "::error::a release needs a pushed v<major>.<minor>.<patch> tag or a tag workflow_dispatch input (got '$TAG')"
              exit 1
              ;;
          esac
  build:
    needs: validate
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      release_tag: ${{ inputs.tag || github.ref_name }}
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/nextgridit-team/aegis-waf
      TAG: ${{ inputs.tag || github.ref_name }}
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Check the community release package
        run: python3 scripts/build-rule-feed.py --check
      - name: Sign the packaged community rules keyless
        run: cosign sign-blob --yes --bundle rules/community/community-rules.zip.bundle rules/community/community-rules.zip
      - name: Embed the signature in the release descriptor
        run: |
          python3 scripts/sign-release.py \
            --bundle rules/community/community-rules.zip.bundle \
            --release rules/community/release.json \
            --output release-assets/release.json
          cp rules/community/community-rules.zip release-assets/community-rules.zip
          cp rules/community/community-rules.zip.bundle release-assets/community-rules.zip.bundle
      - name: Sign the signed descriptor keyless
        run: cosign sign-blob --yes --bundle release-assets/release.json.bundle release-assets/release.json
      - name: Sign the published image digest keyless
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Verify the artifacts this workflow just signed
        run: |
          cosign verify-blob --bundle rules/community/community-rules.zip.bundle \
            --certificate-identity-regexp '^https://github\.com/nextgridit-team/Aegis-WAF/' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            rules/community/community-rules.zip
          cosign verify-blob --bundle release-assets/release.json.bundle \
            --certificate-identity-regexp '^https://github\.com/nextgridit-team/Aegis-WAF/' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            release-assets/release.json
          cosign verify --certificate-identity-regexp '^https://github\.com/nextgridit-team/Aegis-WAF/' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$IMAGE@$DIGEST"
          echo "Verified the image digest, the packaged rules and the signed release descriptor with cosign." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the signed release with the feed client
        run: go test -count=1 -timeout=10m ./internal/app -run TestReleaseSignatureFromReleaseAssets
        env:
          AEGIS_SIGNED_RELEASE_FILE: ${{ github.workspace }}/release-assets/release.json
          AEGIS_SIGNED_PACKAGE_FILE: ${{ github.workspace }}/release-assets/community-rules.zip
      - name: Render the release notes
        run: python3 scripts/release-notes.py --tag "$TAG" > release-notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --verify-tag \
            release-assets/release.json \
            release-assets/community-rules.zip \
            release-assets/community-rules.zip.bundle \
            release-assets/release.json.bundle
      - name: Publish the signed descriptor branch for merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="release/$TAG"
          # Create the branch at the tagged commit and update the descriptor
          # through the API, so no git credentials are handled on the runner.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha="$GITHUB_SHA" >/dev/null
          old_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/rules/community/release.json?ref=$branch" --jq .sha)"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/rules/community/release.json" \
            -f branch="$branch" \
            -f message="Add the signed release descriptor for $TAG [skip ci]" \
            -f content="$(base64 -w0 release-assets/release.json)" \
            -f sha="$old_sha" >/dev/null
          echo "Merge \`$branch\` into main so the official community feed serves the signed descriptor: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch" >> "$GITHUB_STEP_SUMMARY"
