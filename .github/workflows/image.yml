name: Build and publish application image
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: application-image-main
  cancel-in-progress: false
jobs:
  build-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/nextgridit-team/aegis-waf
      TEST_DATABASE_URL: postgres://aegis_ci:ci-test-only@127.0.0.1:5432/aegis_ci?sslmode=disable
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: aegis_ci
          POSTGRES_DB: aegis_ci
          POSTGRES_PASSWORD: ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis_ci -d aegis_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Formatting and static checks
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
      - name: PostgreSQL integration and race checks
        run: go test -race -count=1 ./...
      - name: Check and build dashboard
        run: |
          npm --prefix web ci
          npm --prefix web audit --audit-level=high
          npm --prefix web run build
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build tag
        id: image
        run: echo "build_tag=sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          pull: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.image.outputs.build_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/nextgridit-team/Aegis-WAF
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify exact runtime image before publishing
        run: python3 tests/ci-runtime.py "$IMAGE:${{ steps.image.outputs.build_tag }}"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable build and moving latest
        env:
          BUILD_TAG: ${{ steps.image.outputs.build_tag }}
        run: |
          docker push "$IMAGE:$BUILD_TAG"
          docker push "$IMAGE:latest"
          echo "Published $IMAGE:latest and $IMAGE:$BUILD_TAG" >> "$GITHUB_STEP_SUMMARY"
